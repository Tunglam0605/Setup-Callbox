name: Build and publish Setup CallBox

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/callbox_flasher/requirements-build.txt

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = python -c "from tools.callbox_flasher.src.app_version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match source version v$version"
          }
          "SETUP_CALLBOX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install test dependencies
        run: python -m pip install -r tools/callbox_flasher/requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tools/callbox_flasher/tests -p "test_*.py" -v

      - name: Build portable EXE and self-test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/callbox_flasher/build.ps1

      - name: Verify packaged version
        shell: pwsh
        run: |
          $exe = "tools/callbox_flasher/dist/Setup-CallBox.exe"
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged version command failed" }
          if ($version.Trim() -ne $env:SETUP_CALLBOX_VERSION) {
            throw "Packaged EXE version $version does not match source version $env:SETUP_CALLBOX_VERSION"
          }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged self-test failed" }

      - name: Generate SHA-256 sidecar
        shell: pwsh
        run: |
          $exe = "tools/callbox_flasher/dist/Setup-CallBox.exe"
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Setup-CallBox.exe" | Set-Content -LiteralPath "$exe.sha256" -Encoding ascii
          Get-Content "$exe.sha256"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "tools/callbox_flasher/dist/Setup-CallBox.exe" `
            "tools/callbox_flasher/dist/Setup-CallBox.exe.sha256" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Setup CallBox $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
